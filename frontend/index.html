<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mini blog Supabase</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container-fluid">
        <span class="navbar-brand">Mini blog Supabase</span>
        <div class="d-flex align-items-center ms-auto">
          <span id="current-user-label" class="navbar-text text-white-50 me-3">
            Non connecté
          </span>
          <button id="btn-logout" class="btn btn-outline-light btn-sm d-none">
            Se déconnecter
          </button>
        </div>
      </div>
    </nav>

    <main class="container mb-5">
      <div class="row">
        <div class="col-lg-4 mb-4">
          <div class="card mb-3">
            <div class="card-header">Authentification</div>
            <div class="card-body">
              <ul class="nav nav-tabs mb-3" id="authTabs" role="tablist">
                <li class="nav-item" role="presentation">
                  <button
                    class="nav-link active"
                    id="login-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#login-pane"
                    type="button"
                    role="tab"
                  >
                    Connexion
                  </button>
                </li>
                <li class="nav-item" role="presentation">
                  <button
                    class="nav-link"
                    id="signup-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#signup-pane"
                    type="button"
                    role="tab"
                  >
                    Inscription
                  </button>
                </li>
              </ul>
              <div class="tab-content">
                <div
                  class="tab-pane fade show active"
                  id="login-pane"
                  role="tabpanel"
                >
                  <form id="form-login" class="mb-2">
                    <div class="mb-3">
                      <label for="login-email" class="form-label">Email</label>
                      <input
                        type="email"
                        class="form-control"
                        id="login-email"
                        required
                      />
                    </div>
                    <div class="mb-3">
                      <label for="login-password" class="form-label"
                        >Mot de passe</label
                      >
                      <input
                        type="password"
                        class="form-control"
                        id="login-password"
                        required
                      />
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                      Se connecter
                    </button>
                  </form>
                  <div id="login-message" class="small text-muted"></div>
                </div>
                <div class="tab-pane fade" id="signup-pane" role="tabpanel">
                  <form id="form-signup" class="mb-2">
                    <div class="mb-3">
                      <label for="signup-email" class="form-label">Email</label>
                      <input
                        type="email"
                        class="form-control"
                        id="signup-email"
                        required
                      />
                    </div>
                    <div class="mb-3">
                      <label for="signup-password" class="form-label"
                        >Mot de passe</label
                      >
                      <input
                        type="password"
                        class="form-control"
                        id="signup-password"
                        required
                      />
                    </div>
                    <button type="submit" class="btn btn-success w-100">
                      Créer un compte
                    </button>
                  </form>
                  <div id="signup-message" class="small text-muted"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">Statistiques</div>
            <div class="card-body">
              <p class="mb-1">
                <strong>Nombre total de posts :</strong>
                <span id="stat-total-posts">–</span>
              </p>
              <p class="mb-1">
                <strong>Moyenne de commentaires par post :</strong>
                <span id="stat-avg-comments">–</span>
              </p>
              <p class="mb-0">
                <strong>Moyenne de posts par utilisateur :</strong>
                <span id="stat-avg-posts">–</span>
              </p>
              <button
                id="btn-refresh-stats"
                class="btn btn-outline-secondary btn-sm mt-3"
              >
                Rafraîchir les statistiques
              </button>
            </div>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="card mb-3">
            <div class="card-header d-flex justify-content-between">
              <span>Nouveau post</span>
              <span
                id="new-post-auth-warning"
                class="badge bg-warning text-dark d-none"
              >
                Connectez-vous pour poster
              </span>
            </div>
            <div class="card-body">
              <form id="form-new-post">
                <div class="mb-3">
                  <label for="post-title" class="form-label">Titre</label>
                  <input
                    type="text"
                    class="form-control"
                    id="post-title"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="post-content" class="form-label">Contenu</label>
                  <textarea
                    class="form-control"
                    id="post-content"
                    rows="3"
                    required
                  ></textarea>
                </div>
                <button type="submit" class="btn btn-primary">
                  Publier
                </button>
              </form>
              <div id="new-post-message" class="small text-muted mt-2"></div>
            </div>
          </div>

          <div class="card">
            <div class="card-header d-flex justify-content-between">
              <span>Posts</span>
              <span class="small text-muted" id="posts-info">
                Chargement...
              </span>
            </div>
            <div class="card-body">
              <div id="posts-list" class="vstack gap-3"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
